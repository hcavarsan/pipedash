coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, flags, components"

ignore:
  - "crates/**/test_*.rs"
  - "crates/**/testing.rs"
  - "crates/pipedash-desktop/src/push/stub.rs"
  - "src/testing/**"
  - "src/**/fixtures/**"
  - "scripts/**"

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 50%

  individual_components:
    - component_id: core
      name: core
      paths:
        - "crates/pipedash-core/**"

    - component_id: plugin-api
      name: plugin-api
      paths:
        - "crates/pipedash-plugin-api/**"

    - component_id: providers
      name: providers
      paths:
        - "^crates/pipedash-plugin-(?!api/).*"

    - component_id: desktop
      name: desktop
      paths:
        - "crates/pipedash-desktop/**"
        - "crates/tauri-plugin-*/**"

    - component_id: web
      name: web
      paths:
        - "crates/pipedash-web/**"

    - component_id: push-relay
      name: push-relay
      paths:
        - "crates/pipedash-push-relay/**"

    - component_id: frontend
      name: frontend
      paths:
        - "src/**"
