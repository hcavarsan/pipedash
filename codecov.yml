coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, flags, components"

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 50%

  individual_components:
    - component_id: pipedash-core
      name: pipedash-core
      paths:
        - "crates/pipedash-core/**"

    - component_id: pipedash-desktop
      name: pipedash-desktop
      paths:
        - "crates/pipedash-desktop/**"

    - component_id: pipedash-plugin-actions
