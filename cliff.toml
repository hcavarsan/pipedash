[changelog]
trim = true
body = """
## What's new:
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | striptags | trim }}
{% for commit in commits -%}
- {{ commit.raw_message | split(pat="\n") | first | trim }} ({% if commit.remote.username %}@{{ commit.remote.username }} {% endif %}{% if commit.remote.pr_number and not commit.raw_message is containing("#" ~ commit.remote.pr_number) %}[#{{ commit.remote.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.remote.pr_number }}){% else %}[{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}){% endif %})
{% endfor -%}
{% endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
  { pattern = '(?s)^Merge pull request #[0-9]+ from [^\n]+\n\n(.*)$', replace = '${1}' },
  { pattern = '^Merge pull request #([0-9]+) from .*$', replace = 'chore: merge pull request #${1} (no PR title in commit body)' },
]
commit_parsers = [
  { message = "^Merge (pull request|branch|remote-tracking)", skip = true },
  { message = "^chore(\\([^)]*\\))?: (bump version|release|prepare release)", skip = true },
  { message = "^chore(\\([^)]*\\))?: (add|update|remove) (App Store|Google Play) text", skip = true },
  { message = "^(chore|docs)(\\([^)]*\\))?: (add|update) (the )?(changelog|release notes)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^(chore|build|ci|refactor|perf|test|style|revert|deps)", group = "<!-- 2 -->Maintenance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = ".*", group = "<!-- 4 -->Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "newest"
