name: Set up Rust
description: Install the pinned Rust toolchain, the Linux desktop libraries and a shared build cache.
inputs:
  cache-key:
    description: Cache name shared by jobs that build the same way
    required: true
  desktop-libs:
    description: Install the Linux libraries the desktop crates link against
    required: false
    default: "true"
  tools:
    description: Comma-separated cargo tools to install, such as cargo-nextest
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Linux desktop libraries
      if: ${{ runner.os == 'Linux' && inputs.desktop-libs == 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

    - name: Install Rust
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        install_args: rust
        cache_key_prefix: mise-rust-v1
        cache_restore_retry_budget: 60s

    - name: Cache Rust build
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install cargo tools
      if: ${{ inputs.tools != '' }}
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: ${{ inputs.tools }}
