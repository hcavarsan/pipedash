name: Set up iOS build
description: Install the toolchain that builds the Tauri iOS app with fastlane.
inputs:
  rust-targets:
    description: Space-separated Rust targets to install
    required: true
  cache:
    description: Restore and save the tool cache; keep it off in jobs that publish
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise tools
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        cache: ${{ inputs.cache }}
        cache_key_prefix: mise-all-v1
        cache_restore_retry_budget: 60s

    - name: Install dependencies
      shell: bash
      run: mise run install

    - name: Install Ruby
      uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
      with:
        ruby-version: "3.4"
        working-directory: ios

    - name: Install fastlane
      shell: bash
      working-directory: ios
      run: bundle install

    - name: Install iOS toolchain
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.rust-targets }}
      run: |
        read -r -a targets <<< "$RUST_TARGETS"
        rustup target add "${targets[@]}"
        brew install xcodegen

    - name: Cache Rust build
      if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ios-${{ inputs.rust-targets }}

    - name: Check Xcode version
      shell: bash
      run: |
        xcodebuild -version
        major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
        if [ "$major" -lt 26 ]; then
          echo "App Store Connect requires Xcode 26 or later, found $major" >&2
          exit 1
        fi
