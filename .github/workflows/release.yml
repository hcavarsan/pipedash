name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  K8S_OPENAPI_ENABLED_VERSION: "1.32"
  VITE_ENV: "production"
  TAURI_DEBUG: "false"

jobs:
  validate-version:
    name: Validate version
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout tagged repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release version and signing identity
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          import tomllib
          sys.path.insert(0, "scripts")
          from build_updater_manifest import parse_version, read_public_key

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              raise SystemExit("Release tag must start with v")
          _, prerelease = parse_version(tag)
          versions = {
              "Cargo.toml": tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"],
              "package.json": json.loads(Path("package.json").read_text())["version"],
              "tauri.conf.json": json.loads(Path("crates/pipedash-desktop/tauri.conf.json").read_text())["version"],
          }
          for source, version in versions.items():
              if version != tag[1:]:
                  raise SystemExit(f"{source} version {version} does not match {tag}")
          read_public_key("crates/pipedash-desktop/tauri.conf.json")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"prerelease={str(prerelease).lower()}\n")
          PY

  create-release-draft:
    name: Create release draft
    needs:
      - validate-version
    permissions:
      contents: write # create the draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Create or reuse unpublished draft
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PRERELEASE: ${{ needs.validate-version.outputs.prerelease }}
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const matches = releases.filter(release => release.tag_name === context.ref.replace('refs/tags/', ''));
            if (matches.length > 1) throw new Error('Duplicate releases for this tag');
            let release = matches[0];
            if (release && !release.draft) throw new Error('Refusing to overwrite an already-published release');
            if (!release) {
              const result = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: context.ref.replace('refs/tags/', ''),
                target_commitish: context.sha,
                name: `Pipedash - ${context.ref.replace('refs/tags/', '')}`,
                draft: true,
                prerelease: process.env.PRERELEASE === 'true'
              });
              release = result.data;
            } else {
              await github.rest.repos.updateRelease({
                ...context.repo,
                release_id: release.id,
                draft: true,
                prerelease: process.env.PRERELEASE === 'true'
              });
            }
            core.setOutput('id', release.id);

  pipedash:
    name: Build (${{ matrix.os }} ${{ matrix.arch }})
    needs: [create-release-draft, validate-version]
    permissions:
      contents: write # upload build assets to the draft release
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: arm64
            runner: ubicloud-standard-4-arm-ubuntu-2204
            rust_target: aarch64-unknown-linux-gnu
            tauri_args: "--target aarch64-unknown-linux-gnu --bundles deb,rpm,appimage --verbose"
          - os: ubuntu-22.04
            arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage --verbose"
          - os: macos-latest
            arch: universal
            rust_target: universal-apple-darwin
            tauri_args: "--target universal-apple-darwin --bundles dmg,app --verbose"
          - os: windows-latest
            arch: x86
            rust_target: i686-pc-windows-msvc
            tauri_args: "--target i686-pc-windows-msvc --bundles nsis --verbose"
            msvc_arch: x86
          - os: windows-latest
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            tauri_args: "--target x86_64-pc-windows-msvc --bundles nsis --verbose"
            msvc_arch: x64
          - os: windows-latest
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            tauri_args: "--target aarch64-pc-windows-msvc --bundles nsis --verbose"

    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: false

      - name: Install mise tools
        run: mise install

      - name: Install dependencies
        run: mise run install

      - name: Set up Visual Studio shell
        if: matrix.os == 'windows-latest' && matrix.arch == 'arm64'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: amd64_arm64

      - name: Setup platform-specific dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt install -y \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libwebkit2gtk-4.1-dev \
              patchelf \
              xdg-utils

      - name: Reconfigure Rust targets
        env:
          MATRIX_OS: ${{ matrix.os }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          if [ "$MATRIX_OS" == "macos-latest" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "$RUST_TARGET"
          fi
        shell: bash

      - name: Install NASM on Windows
        if: matrix.os == 'windows-latest'
        run: choco install nasm

      - name: Require configured updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed desktop releases"
            exit 1
          fi

      - name: Build pipedash Desktop App
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri_build
        continue-on-error: true
        env:
          RUSTFLAGS: '-C link-arg=-s'
          AWS_LC_SYS_CMAKE_CFLAGS: ${{ matrix.os == 'windows-latest' && '/std:c11' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6000
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release-draft.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "Pipedash - ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: ${{ needs.validate-version.outputs.prerelease }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: ${{ matrix.tauri_args }} --config crates/pipedash-desktop/tauri.updater.conf.json

      - name: Retry Build on Failure
        if: steps.tauri_build.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          RUSTFLAGS: '-C link-arg=-s'
          AWS_LC_SYS_CMAKE_CFLAGS: ${{ matrix.os == 'windows-latest' && '/std:c11' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6000
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release-draft.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "Pipedash - ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: ${{ needs.validate-version.outputs.prerelease }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: ${{ matrix.tauri_args }} --config crates/pipedash-desktop/tauri.updater.conf.json

  docker-build:
    name: Build Docker image (${{ matrix.platform }})
    needs: [ create-release-draft ]
    permissions:
      contents: read # checkout the repository
      packages: write # push the per-platform image by digest to ghcr.io
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: ./docker/Dockerfile
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/pipedash-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish Docker image
    needs: [ docker-build ]
    permissions:
      packages: write # publish the multi-platform manifest to ghcr.io
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/pipedash-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}

      - name: Create and push manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pipedash-web
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pipedash-web
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  publish-cargo-crates:
    name: Publish crates to crates.io
    needs: [ create-release-draft ]
    permissions:
      contents: read # checkout the repository
      id-token: write # mint short-lived crates.io tokens via trusted publishing
    runs-on: ubuntu-22.04
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref, '-beta') &&
      !contains(github.ref, '-alpha')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: false

      - name: Install mise tools
        run: mise install

      - name: Build frontend assets for pipedash-web
        run: |
          mise run install
          mise run build:front

      # crates.io trusted-publishing tokens expire after 30 minutes and the full
      # publish takes longer, so each crate gets its own token.
      - name: Write publish helper
        run: |
          cat > "$RUNNER_TEMP/publish_crate.sh" <<'EOF'
          set -eo pipefail
          crate_path="$1"
          crate_name=$(basename "$crate_path")
          max_retries=3
          retry_delay=30
          publish_args=()
          if [ "${3:-}" = "allow-dirty" ]; then
            publish_args+=(--allow-dirty)
          fi

          # Wait 60s between publishes to avoid rate limiting
          if [ "${2:-}" = "wait" ]; then
            echo "Waiting 60s to avoid rate limiting..."
            sleep 60
          fi

          echo "Publishing $crate_name..."
          cd "$crate_path"

          version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg n "$crate_name" '.packages[] | select(.name == $n) | .version')
          if curl -sf -A "pipedash-release" "https://crates.io/api/v1/crates/$crate_name/$version" >/dev/null; then
            echo "$crate_name $version already published, skipping"
            exit 0
          fi

          for attempt in $(seq 1 "$max_retries"); do
            echo "Attempt $attempt/$max_retries for $crate_name"

            if cargo publish "${publish_args[@]}"; then
              echo "Successfully published $crate_name"
              exit 0
            fi

            if [ "$attempt" -lt "$max_retries" ]; then
              echo "Retrying $crate_name in ${retry_delay}s..."
              sleep "$retry_delay"
              retry_delay=$((retry_delay * 2))
            else
              echo "Failed to publish $crate_name after $max_retries attempts"
              exit 1
            fi
          done
          EOF
          chmod +x "$RUNNER_TEMP/publish_crate.sh"

      # Publish in dependency order
      - name: Authenticate to crates.io (pipedash-plugin-api)
        id: auth-plugin-api
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-api.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-api

      - name: Authenticate to crates.io (pipedash-plugin-actions)
        id: auth-plugin-actions
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-actions
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-actions.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-actions wait

      - name: Authenticate to crates.io (pipedash-plugin-github)
        id: auth-plugin-github
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-github
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-github.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-github wait

      - name: Authenticate to crates.io (pipedash-plugin-gitlab)
        id: auth-plugin-gitlab
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-gitlab
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-gitlab.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-gitlab wait

      - name: Authenticate to crates.io (pipedash-plugin-bitbucket)
        id: auth-plugin-bitbucket
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-bitbucket
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-bitbucket.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-bitbucket wait

      - name: Authenticate to crates.io (pipedash-plugin-buildkite)
        id: auth-plugin-buildkite
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-buildkite
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-buildkite.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-buildkite wait

      - name: Authenticate to crates.io (pipedash-plugin-jenkins)
        id: auth-plugin-jenkins
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-jenkins
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-jenkins.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-jenkins wait

      - name: Authenticate to crates.io (pipedash-plugin-tekton)
        id: auth-plugin-tekton
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-tekton
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-tekton.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-tekton wait

      - name: Authenticate to crates.io (pipedash-plugin-argocd)
        id: auth-plugin-argocd
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-argocd
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-argocd.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-argocd wait

      - name: Authenticate to crates.io (pipedash-plugin-gitea)
        id: auth-plugin-gitea
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-gitea
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-gitea.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-gitea wait

      - name: Authenticate to crates.io (pipedash-plugin-fluxcd)
        id: auth-plugin-fluxcd
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-fluxcd
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-fluxcd.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-fluxcd wait

      - name: Authenticate to crates.io (pipedash-plugin-azure-devops)
        id: auth-plugin-azure-devops
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-azure-devops
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-azure-devops.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-azure-devops wait

      - name: Authenticate to crates.io (pipedash-plugin-komodo)
        id: auth-plugin-komodo
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-komodo
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-komodo.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-komodo wait

      - name: Authenticate to crates.io (pipedash-plugin-prow)
        id: auth-plugin-prow
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-plugin-prow
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-plugin-prow.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-plugin-prow wait

      - name: Authenticate to crates.io (pipedash-core)
        id: auth-core
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-core.outputs.token }}
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-core wait

      - name: Authenticate to crates.io (pipedash-web)
        id: auth-web
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish pipedash-web
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-web.outputs.token }}
        # dist/ is gitignored build output from the frontend step, and cargo
        # counts packaged files that git ignores as uncommitted changes.
        run: |
          "$RUNNER_TEMP/publish_crate.sh" crates/pipedash-web wait allow-dirty

  update-release:
    name: Update release notes and publish
    needs: [pipedash, create-release-draft, validate-version]
    permissions:
      contents: write # update release notes and publish the release
    runs-on: ubuntu-24.04
    concurrency:
      group: pipedash-release-publication
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update draft release notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RELEASE_ID: ${{ needs.create-release-draft.outputs.release_id }}
          BODY: ${{ steps.git-cliff.outputs.content }}
        with:
          script: |
            const fs = require('node:fs');
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (!release.draft || release.tag_name !== process.env.GITHUB_REF_NAME) {
              throw new Error('Refusing to modify a published release or a different tag');
            }
            const { data: updated } = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id,
              body: process.env.BODY,
              name: `Pipedash - ${process.env.GITHUB_REF_NAME}`
            });
            fs.writeFileSync('release-notes.txt', updated.body || '');

      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Download complete draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --dir release-assets

      - name: Verify every signed artifact and build manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build_updater_manifest.py \
            --tag "$TAG" \
            --assets-dir release-assets \
            --notes-file release-notes.txt \
            --config crates/pipedash-desktop/tauri.conf.json \
            --output latest.json

      - name: Upload verified manifest to unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release-draft.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > draft-release.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads(Path("draft-release.json").read_text())
          if not release["draft"] or release["tag_name"] != os.environ["TAG"]:
              raise SystemExit("Refusing to overwrite a published release or a different tag")
          PY
          gh release upload "$TAG" latest.json --clobber

      - name: Publish complete verified release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RELEASE_ID: ${{ needs.create-release-draft.outputs.release_id }}
          PRERELEASE: ${{ needs.validate-version.outputs.prerelease }}
        with:
          script: |
            const fs = require('node:fs');
            const { createHash } = require('node:crypto');
            const verifyAsset = async asset => {
              const path = `release-assets/${asset.name}`;
              if (asset.size !== fs.statSync(path).size) throw new Error(`Release asset changed: ${asset.name}`);
              const hash = createHash('sha256');
              for await (const chunk of fs.createReadStream(path)) hash.update(chunk);
              if (asset.digest !== `sha256:${hash.digest('hex')}`) {
                throw new Error(`Release asset digest missing or changed after verification: ${asset.name}`);
              }
            };
            const manifest = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            const release_id = Number(process.env.RELEASE_ID);
            const tag = process.env.GITHUB_REF_NAME;
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (!release.draft || release.tag_name !== tag || manifest.version !== tag.slice(1)) {
              throw new Error('Release must remain a draft with the verified tag/version');
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id });
            const requireAsset = name => {
              const matches = assets.filter(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0);
              if (matches.length !== 1) throw new Error(`Missing or duplicate release asset: ${name}`);
              return matches[0];
            };
            const expectedTargets = [
              'linux-x86_64-appimage', 'linux-aarch64-appimage',
              'darwin-x86_64-app', 'darwin-aarch64-app',
              'windows-i686-nsis', 'windows-x86_64-nsis', 'windows-aarch64-nsis'
            ];
            if (Object.keys(manifest.platforms).sort().join() !== expectedTargets.sort().join()) {
              throw new Error('Manifest does not contain exactly the seven native targets');
            }
            const prefix = `https://github.com/hcavarsan/pipedash/releases/download/${encodeURIComponent(tag)}/`;
            const payloads = new Set();
            for (const entry of Object.values(manifest.platforms)) {
              if (!entry.url.startsWith(prefix)) throw new Error('Unexpected artifact URL');
              const name = decodeURIComponent(entry.url.slice(prefix.length));
              if (!payloads.has(name)) {
                await verifyAsset(requireAsset(name));
                await verifyAsset(requireAsset(`${name}.sig`));
              }
              payloads.add(name);
            }
            if (payloads.size !== 6) throw new Error('Expected exactly six native artifact/signature pairs');
            const uploadedManifest = requireAsset('latest.json');
            const response = await github.rest.repos.getReleaseAsset({
              ...context.repo, asset_id: uploadedManifest.id,
              headers: { accept: 'application/octet-stream' }
            });
            if (!Buffer.from(response.data).equals(fs.readFileSync('latest.json'))) {
              throw new Error('Uploaded manifest differs from the verified manifest');
            }
            const stableVersion = value => {
              const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(value);
              if (!match) throw new Error(`Latest stable release has an invalid tag: ${value}`);
              return match.slice(1, 4).map(BigInt);
            };
            const newer = (candidate, current) => {
              for (let index = 0; index < 3; index++) {
                if (candidate[index] !== current[index]) return candidate[index] > current[index];
              }
              return false;
            };
            let latest;
            try {
              latest = (await github.rest.repos.getLatestRelease(context.repo)).data;
              if (latest.draft || latest.prerelease) throw new Error('Latest release is not stable');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const prerelease = process.env.PRERELEASE === 'true';
            const makeLatest = !prerelease && (!latest || newer(stableVersion(tag), stableVersion(latest.tag_name)));
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id,
              draft: false,
              prerelease,
              make_latest: makeLatest ? 'true' : 'false'
            });
