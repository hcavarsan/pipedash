name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  K8S_OPENAPI_ENABLED_VERSION: "1.32"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  lint-workflows:
    name: Lint / Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: true

      - name: Install zizmor
        run: mise install zizmor

      - name: Lint workflows
        run: mise run lint:actions

  lint-structure:
    name: Lint / Structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up frontend
        uses: $/.github/actions/setup-frontend

      - name: Check source structure
        run: mise run lint:structure

      - name: Check duplication
        run: mise run lint:dup

  lint-frontend:
    name: Lint / Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up frontend
        uses: $/.github/actions/setup-frontend

      - name: Lint and format check
        run: mise run lint:front

  lint-rustfmt:
    name: Lint / Rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: true

      - name: Install Rust
        run: mise install rust

      - name: Check formatting
        run: mise run fmt:back:check

  lint-clippy:
    name: Lint / Clippy (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # checkout the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: clippy

      - name: Run Clippy
        run: mise run lint:back

  test-frontend:
    name: Test / Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout the repository
      id-token: write # Codecov OIDC upload, no long-lived CODECOV_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up frontend
        uses: $/.github/actions/setup-frontend

      - name: Test icon generation
        run: python3 scripts/test_icons.py

      - name: Test screenshot exporter
        working-directory: ios/app-store-screenshots
        run: bun install --frozen-lockfile && bun run test

      - name: Test frontend
        run: bun run test --coverage --coverage-reporter=lcov --reporter=junit --reporter-outfile=junit.xml ./scripts/coverage-baseline.ts

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: coverage/lcov.info
          flags: frontend
          slug: hcavarsan/pipedash

      - name: Upload test results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: junit.xml
          flags: frontend
          slug: hcavarsan/pipedash
          report_type: test_results

  test-rust:
    name: Test / Rust (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read # checkout the repository
      id-token: write # Codecov OIDC upload, no long-lived CODECOV_TOKEN
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pipedash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pipedash_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: test-coverage
          tools: cargo-llvm-cov,cargo-nextest

      - name: Run tests
        run: cargo llvm-cov nextest --no-report --workspace --all-features --profile ci

      - name: Run PostgreSQL tests
        run: cargo llvm-cov nextest --no-report -p pipedash-core --all-features --profile ci-postgres --run-ignored only postgres

      - name: Write coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: lcov.info
          flags: backend
          slug: hcavarsan/pipedash

      - name: Upload test results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: target/nextest/ci/junit.xml,target/nextest/ci-postgres/junit.xml
          flags: backend
          slug: hcavarsan/pipedash
          report_type: test_results

  test-rust-desktop:
    name: Test / Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # checkout the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: test
          tools: cargo-nextest

      - name: Run tests
        run: cargo nextest run --workspace --all-features --profile ci

  build-frontend:
    name: Build / Frontend bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout the repository
      id-token: write # Codecov OIDC upload, no long-lived CODECOV_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up frontend
        uses: $/.github/actions/setup-frontend

      - name: Build with bundle analysis
        env:
          CODECOV_BUNDLE_ANALYSIS: "true"
          CODECOV_OIDC: ${{ !github.event.pull_request.head.repo.fork }}
        run: bun run build

  build-crates:
    name: Build / Plugin crate packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: package

      - name: Verify plugin packages
        run: |
          crates="pipedash-plugin-api pipedash-plugin-actions pipedash-plugins $(grep -l 'register_plugin!' crates/pipedash-plugin-*/src/lib.rs | cut -d/ -f2)"
          args=()
          for crate in $crates; do
            args+=(-p "$crate" --config "patch.crates-io.$crate.path=\"crates/$crate\"")
          done
          cargo package "${args[@]}"
