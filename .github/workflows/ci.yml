name: PR

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  K8S_OPENAPI_ENABLED_VERSION: "1.32"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no long-lived CODECOV_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: true

      - name: Install mise tools
        run: mise install

      - name: Install dependencies
        run: mise run install

      - name: Test icon generation
        run: python3 scripts/test_icons.py

      - name: Lint and format check
        run: mise run lint:front

      - name: Test frontend
        run: bun run test --coverage --coverage-reporter=lcov --reporter=junit --reporter-outfile=junit.xml

      - name: Upload frontend coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: coverage/lcov.info
          flags: frontend
          slug: hcavarsan/pipedash

      - name: Upload frontend test results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: junit.xml
          flags: frontend
          slug: hcavarsan/pipedash
          report_type: test_results

      - name: Build frontend with bundle analysis
        env:
          CODECOV_BUNDLE_ANALYSIS: "true"
          CODECOV_OIDC: ${{ !github.event.pull_request.head.repo.fork }}
        run: bun run build

  zizmor:
    name: zizmor
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: true

      - name: Install mise tools
        run: mise install

      - name: Lint workflows
        run: mise run lint:actions

  rust-format:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libwebkit2gtk-4.1-dev \
              patchelf \
              xdg-utils

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: true

      - name: Install mise tools
        run: mise install

      - name: Run rustfmt
        run: mise run fmt:back:check

  rust-lint:
    name: Clippy
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            os_name: linux
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            os_name: macos
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            os_name: windows
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no long-lived CODECOV_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt install -y \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libwebkit2gtk-4.1-dev \
              patchelf \
              xdg-utils

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: true

      - name: Install mise tools
        run: mise install

      - name: Configure Rust targets
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: rustup target add "$RUST_TARGET"
        shell: bash

      - name: Run Clippy
        run: mise run lint:back

      - name: Install cargo-llvm-cov and nextest
        if: matrix.os_name != 'linux'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Run tests
        if: matrix.os_name != 'linux'
        run: cargo llvm-cov nextest --workspace --all-features --profile ci --lcov --output-path lcov.info

      - name: Upload coverage
        if: matrix.os_name != 'linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: lcov.info
          flags: backend
          slug: hcavarsan/pipedash

      - name: Upload test results
        if: ${{ matrix.os_name != 'linux' && !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: target/nextest/ci/junit.xml
          flags: backend
          slug: hcavarsan/pipedash
          report_type: test_results

  rust-test:
    name: Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no long-lived CODECOV_TOKEN
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pipedash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pipedash_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libwebkit2gtk-4.1-dev \
              patchelf \
              xdg-utils

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: true

      - name: Install mise tools
        run: mise install

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Run tests
        run: cargo llvm-cov nextest --no-report --workspace --all-features --profile ci

      - name: Run PostgreSQL tests
        run: cargo llvm-cov nextest --no-report -p pipedash-core --all-features --profile ci-postgres --run-ignored only postgres

      - name: Write coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: lcov.info
          flags: backend
          slug: hcavarsan/pipedash

      - name: Upload test results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: target/nextest/ci/junit.xml,target/nextest/ci-postgres/junit.xml
          flags: backend
          slug: hcavarsan/pipedash
          report_type: test_results

      - name: Verify plugin packages
        run: cargo package -p pipedash-plugin-api -p pipedash-plugin-actions -p pipedash-plugin-github -p pipedash-plugin-gitea -p pipedash-plugin-fluxcd
