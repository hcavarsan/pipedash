[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.12.0"
authors = ["Pipedash Team"]
edition = "2021"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
dirs = "7.0"
flate2 = "1"
futures = "0.3"
futures-util = "0.3"
glob = "0.3"
http = "1.5"
indexmap = { version = "2", features = ["serde"] }
keyring = "4"
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.2", features = ["client", "config", "runtime"] }
lz4_flex = { version = "0.14", default-features = false, features = [
  "checked-decode",
  "safe-decode",
  "safe-encode",
  "std",
] }
memchr = "2"
mime_guess = "2.0"
octocrab = { version = "0.54.8", default-features = false, features = [
  "follow-redirect",
  "reqwest",
  "retry",
  "timeout",
  "tracing",
] }
pipedash-core = { version = "0.12.0", path = "crates/pipedash-core" }
pipedash-plugin-actions = { version = "0.12.0", path = "crates/pipedash-plugin-actions" }
pipedash-plugin-api = { version = "0.12.0", path = "crates/pipedash-plugin-api" }
pipedash-plugins = { version = "0.12.0", path = "crates/pipedash-plugins" }
pipedash-web = { version = "0.12.0", path = "crates/pipedash-web", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "rustls-no-provider",
] }
ring = "0.17"
rust-embed = "8.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.7"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0"
sha2 = "0.11"
shellexpand = "3.1"
sqlx = { version = "0.9", features = [
  "chrono",
  "migrate",
  "postgres",
  "runtime-tokio",
  "sqlite",
] }
subtle = "2.6"
tauri = "2"
tauri-build = "2"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-pipedash-native = { path = "crates/tauri-plugin-pipedash-native" }
tauri-plugin-pipedash-push = { path = "crates/tauri-plugin-pipedash-push" }
tauri-plugin-single-instance = "2.5.5"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
tokio-util = "0.7"
toml = "1.1"
toml_edit = "0.25"
tower = "0.5"
tower-http = { version = "0.7", features = [
  "compression-gzip",
  "cors",
  "fs",
  "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
urlencoding = "2.1"

[patch.crates-io]
pipedash-core = { path = "crates/pipedash-core" }
pipedash-plugin-actions = { path = "crates/pipedash-plugin-actions" }
pipedash-plugin-api = { path = "crates/pipedash-plugin-api" }
pipedash-plugins = { path = "crates/pipedash-plugins" }
