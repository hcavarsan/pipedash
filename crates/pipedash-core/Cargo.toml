[package]
name = "pipedash-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Framework-agnostic core library for Pipedash"
repository = "https://github.com/hcavarsan/pipedash"
license = "GPL-3.0"

[lib]
crate-type = ["rlib"]

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
dirs.workspace = true
futures.workspace = true
glob.workspace = true
hostname.workspace = true
indexmap.workspace = true
lz4_flex.workspace = true
memchr.workspace = true
pipedash-plugin-api.workspace = true
pipedash-plugin-argocd.workspace = true
pipedash-plugin-azure-devops.workspace = true
pipedash-plugin-bitbucket.workspace = true
pipedash-plugin-buildkite.workspace = true
pipedash-plugin-fluxcd.workspace = true
pipedash-plugin-github.workspace = true
pipedash-plugin-gitea.workspace = true
pipedash-plugin-gitlab.workspace = true
pipedash-plugin-jenkins.workspace = true
pipedash-plugin-komodo.workspace = true
pipedash-plugin-prow.workspace = true
pipedash-plugin-tekton.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
pipedash-plugin-actions.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["postgres"]
full = ["postgres"]
postgres = []
