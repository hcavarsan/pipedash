[package]
name = "pipedash-push-relay"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "APNs push relay for Pipedash"
repository = "https://github.com/hcavarsan/pipedash"
license = "GPL-3.0"
publish = false

[[bin]]
name = "pipedash-push-relay"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
# APNs only speaks HTTP/2; no other crate in the workspace needs it
reqwest = { workspace = true, features = ["http2"] }
# Already in the tree through rustls; signs the ES256 provider token
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The stub APNs server must accept HTTP/2 without TLS
axum = { workspace = true, features = ["http2"] }
tempfile.workspace = true
tower.workspace = true
