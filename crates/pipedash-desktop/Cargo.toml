[package]
name = "pipedash-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "A Tauri App"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "pipedash_desktop_lib"

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
pipedash-core.workspace = true
pipedash-plugin-api.workspace = true
pipedash-plugin-argocd.workspace = true
pipedash-plugin-azure-devops.workspace = true
pipedash-plugin-bitbucket.workspace = true
pipedash-plugin-buildkite.workspace = true
pipedash-plugin-fluxcd.workspace = true
pipedash-plugin-github.workspace = true
pipedash-plugin-gitea.workspace = true
pipedash-plugin-gitlab.workspace = true
pipedash-plugin-jenkins.workspace = true
pipedash-plugin-komodo.workspace = true
pipedash-plugin-tekton.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-os.workspace = true
tauri-plugin-pipedash-native.workspace = true
tauri-plugin-pipedash-push.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
jni = "0.22"
keyring-core = "1"
ndk-context = "0.1"
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }
keyring-core = "1"

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
keyring-core = "1"
tempfile.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["postgres"]
devtools = ["tauri/devtools"]
postgres = ["pipedash-core/postgres"]
