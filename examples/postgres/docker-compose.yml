services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    platform: linux/amd64
    environment:
      POSTGRES_USER: pipedash
      POSTGRES_PASSWORD: change-me-to-a-secure-password
      POSTGRES_DB: pipedash
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipedash -d pipedash"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pipedash-data-init:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - pipedash-data:/data

  pipedash:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      platforms:
        - linux/amd64
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      PIPEDASH_BIND_ADDR: 0.0.0.0:8080
      PIPEDASH_DATA_DIR: /data
      PIPEDASH_METRICS_ENABLED: "true"
      PIPEDASH_EMBEDDED_FRONTEND: "true"
      PIPEDASH_CONFIG_PATH: /config/config.toml
      PIPEDASH_VAULT_PASSWORD: vaultpassword@123
      PIPEDASH_POSTGRES_URL: postgres://pipedash:change-me-to-a-secure-password@postgres:5432/pipedash
      GITHUB_TOKEN: your-github-token-here
    volumes:
      - ./config.toml:/config/config.toml:ro
      - pipedash-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      pipedash-data-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  pipedash-data:
