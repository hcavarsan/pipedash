apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-healthy
  namespace: pipedash-examples
spec:
  interval: 10m
  timeout: 3m
  releaseName: podinfo-healthy
  targetNamespace: podinfo-helm-healthy
  storageNamespace: podinfo-helm-healthy
  install:
    createNamespace: true
  chart:
    spec:
      chart: podinfo
      version: 6.7.1
      sourceRef:
        kind: HelmRepository
        name: podinfo
  values:
    replicaCount: 1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-failed
  namespace: pipedash-examples
spec:
  interval: 10m
  timeout: 30s
  releaseName: podinfo-failed
  targetNamespace: podinfo-helm-failed
  storageNamespace: podinfo-helm-failed
  install:
    createNamespace: true
    remediation:
      retries: 0
  chart:
    spec:
      chart: podinfo
      version: 6.7.1
      sourceRef:
        kind: HelmRepository
        name: podinfo
  values:
    replicaCount: 1
    image:
      tag: does-not-exist
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-suspended
  namespace: pipedash-examples
spec:
  suspend: true
  interval: 10m
  releaseName: podinfo-suspended
  targetNamespace: podinfo-helm-suspended
  storageNamespace: podinfo-helm-suspended
  install:
    createNamespace: true
  chart:
    spec:
      chart: podinfo
      version: 6.7.1
      sourceRef:
        kind: HelmRepository
        name: podinfo
