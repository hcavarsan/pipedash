apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipedash-readonly
  namespace: pipedash-examples
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipedash-readonly
  namespace: pipedash-examples
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipedash-readonly
  namespace: pipedash-examples
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipedash-readonly
subjects:
  - kind: ServiceAccount
    name: pipedash-readonly
    namespace: pipedash-examples
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipedash-readonly-workloads
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipedash-readonly-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipedash-readonly-workloads
subjects:
  - kind: ServiceAccount
    name: pipedash-readonly
    namespace: pipedash-examples
