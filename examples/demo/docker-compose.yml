name: pipedash-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pipedash
      POSTGRES_PASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
      POSTGRES_DB: pipedash
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/metrics.sql:/docker-entrypoint-initdb.d/metrics.sql:ro
    networks: [apis]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipedash -d pipedash"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gitea:
    image: gitea/gitea:1.25.5
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__LOCAL_ROOT_URL: http://gitea:3000/
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE: "false"
    volumes:
      - gitea-data:/data
    networks: [default, apis]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  gitea-seed:
    image: gitea/gitea:1.25.5
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      GITEA_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
    volumes:
      - gitea-data:/data
      - ./gitea:/seed:ro
      - shared:/shared
      - credentials:/credentials
    depends_on:
      gitea:
        condition: service_healthy
    restart: "no"

  runner:
    image: gitea/act_runner:0.6.1
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /shared/runner-token
      GITEA_RUNNER_LABELS: ubuntu-latest:host
    volumes:
      - ./gitea/runner.yaml:/config.yaml:ro
      - runner-data:/data
      - shared:/shared:ro
    mem_limit: 512m
    depends_on:
      gitea-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  jenkins:
    build: ./jenkins
    environment:
      JAVA_OPTS: -Xmx768m -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /casc/jenkins.yaml
      JENKINS_PASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./jenkins/jenkins.yaml:/casc/jenkins.yaml:ro
    networks: [default, apis]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  k3s:
    image: rancher/k3s:v1.37.1-k3s1
    hostname: k3s
    command: server --disable=traefik --disable=metrics-server --tls-san=k3s
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_KUBECONFIG_OUTPUT: /shared/k3s.yaml
      K3S_KUBECONFIG_MODE: "600"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-node:/etc/rancher/node
      - shared:/shared
    networks: [default, apis]
    mem_limit: 3g
    restart: unless-stopped

  k8s-seed:
    image: alpine/k8s:1.37.1
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      KUBECONFIG: /shared/kubeconfig
      FLUX_VERSION: v2.9.6
      TEKTON_VERSION: v1.17.1
      ARGOCD_CHART_VERSION: 10.11.6
    volumes:
      - ./k8s:/seed:ro
      - shared:/shared
      - credentials:/credentials
    depends_on:
      k3s:
        condition: service_started
      gitea-seed:
        condition: service_completed_successfully
    restart: "no"

  komodo-mongo:
    image: mongo:8.0
    command: --quiet --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_ROOT_USERNAME: komodo
      MONGO_INITDB_ROOT_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
    volumes:
      - komodo-mongo:/data/db
    mem_limit: 768m
    restart: unless-stopped

  komodo:
    image: ghcr.io/moghtech/komodo-core:2.3.4
    init: true
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
      KOMODO_DATABASE_USERNAME: komodo
      KOMODO_DATABASE_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: admin
      KOMODO_INIT_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
      KOMODO_FIRST_SERVER_NAME: demo
      KOMODO_DISABLE_INIT_RESOURCES: "true"
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_TRANSPARENT_MODE: "true"
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
    volumes:
      - komodo-keys:/config/keys
    networks: [default, apis]
    mem_limit: 512m
    depends_on:
      - komodo-mongo
    restart: unless-stopped

  komodo-docker:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - komodo-docker:/var/lib/docker
    mem_limit: 1g
    restart: unless-stopped

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4
    init: true
    environment:
      DOCKER_HOST: tcp://komodo-docker:2375
      PERIPHERY_CORE_ADDRESS: ws://komodo:9120
      PERIPHERY_CONNECT_AS: demo
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
    volumes:
      - komodo-keys:/config/keys
    mem_limit: 256m
    depends_on:
      - komodo
      - komodo-docker
    restart: unless-stopped

  komodo-seed:
    image: alpine/k8s:1.37.1
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      KOMODO_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
    volumes:
      - ./komodo:/seed:ro
      - credentials:/credentials
    depends_on:
      - komodo-periphery
    restart: "no"

  pipedash:
    image: ${PIPEDASH_IMAGE:-ghcr.io/hcavarsan/pipedash-web:latest}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PIPEDASH_BIND_ADDR: 0.0.0.0:8080
      PIPEDASH_DATA_DIR: /data
      PIPEDASH_CONFIG_PATH: /config/config.toml
      PIPEDASH_DEMO_MODE: "true"
      PIPEDASH_VAULT_PASSWORD: pipedash-demo
      PIPEDASH_POSTGRES_URL: postgres://pipedash:${DEMO_READER_PASSWORD:-pipedash-reader}@postgres:5432/pipedash
      DEMO_VAULT_PASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
      GITEA_TOKEN_FILE: /credentials/gitea-token
      ARGOCD_TOKEN_FILE: /credentials/argocd-token
      JENKINS_PASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
      KOMODO_API_KEY_FILE: /credentials/komodo-api-key
      KOMODO_API_SECRET_FILE: /credentials/komodo-api-secret
      SSL_CERT_FILE: /status-ca/root.crt
    volumes:
      - ./config.toml:/config/config.toml:ro
      - credentials:/credentials:ro
      - status-ca:/status-ca:ro
    tmpfs:
      - /data:uid=65532,gid=65532
      - /tmp:uid=65532,gid=65532
    networks: [apis]
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      jenkins:
        condition: service_healthy
      k8s-seed:
        condition: service_completed_successfully
      komodo-seed:
        condition: service_completed_successfully
      status:
        condition: service_healthy
    restart: unless-stopped

  status:
    image: caddy:2.11.7-alpine
    entrypoint:
      - sh
      - -c
      - |
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile &
        until [ -s /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done
        install -m 644 /data/caddy/pki/authorities/local/root.crt /ca/root.crt
        wait
    volumes:
      - ./status:/srv:ro
      - ./status/Caddyfile:/etc/caddy/Caddyfile:ro
      - status-data:/data
      - status-ca:/ca
    networks:
      apis:
        aliases: [status.gitea.demo, status.jenkins.demo, status.argocd.demo]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "test", "-s", "/ca/root.crt"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  gateway:
    image: nginx:1.31-alpine
    environment:
      ANALYTICS_SNIPPET: ${ANALYTICS_SNIPPET:-}
    volumes:
      - ./gateway:/etc/nginx/templates:ro
    ports:
      - "127.0.0.1:${PIPEDASH_PORT:-8080}:8080"
    networks: [edge, apis]
    mem_limit: 64m
    depends_on:
      - pipedash
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.10.5
    command: tunnel --no-autoupdate run
    profiles: [public]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [edge]
    mem_limit: 128m
    depends_on:
      - gateway
    restart: unless-stopped

  views-seed:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      PGHOST: postgres
      PGUSER: pipedash
      PGDATABASE: pipedash
      PGPASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
    volumes:
      - ./postgres:/seed:ro
    networks: [apis]
    depends_on:
      - pipedash
    restart: "no"

networks:
  default:
  edge:
  apis:
    internal: true

volumes:
  postgres-data:
  gitea-data:
  runner-data:
  jenkins-home:
  k3s-data:
  k3s-node:
  shared:
  credentials:
  komodo-mongo:
  komodo-keys:
  komodo-docker:
  status-data:
  status-ca:
