name: pipedash-demo

services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: pipedash
      POSTGRES_PASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
      POSTGRES_DB: pipedash
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/metrics.sql:/docker-entrypoint-initdb.d/metrics.sql:ro
    networks: [apis]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipedash -d pipedash"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gitea:
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__LOCAL_ROOT_URL: http://gitea:3000/
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE: "false"
    volumes:
      - gitea-data:/data
    networks: [default, apis]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  gitea-seed:
    image: gitea/gitea:28.3.0@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      GITEA_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
    volumes:
      - gitea-data:/data
      - ./gitea:/seed:ro
      - shared:/shared
      - credentials:/credentials
    depends_on:
      gitea:
        condition: service_healthy
    restart: "no"

  runner:
    image: gitea/act_runner:0.6.1@sha256:b5c35d6bdbb9bb25e531230bfc7cc663cb751406cbec90a2a891b85fea54de86
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /shared/runner-token
      GITEA_RUNNER_LABELS: ubuntu-latest:host
    volumes:
      - ./gitea/runner.yaml:/config.yaml:ro
      - runner-data:/data
      - shared:/shared:ro
    mem_limit: 512m
    depends_on:
      gitea-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  jenkins:
    build: ./jenkins
    environment:
      JAVA_OPTS: -Xmx768m -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /casc/jenkins.yaml
      JENKINS_PASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./jenkins/jenkins.yaml:/casc/jenkins.yaml:ro
    networks: [default, apis]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  k3s:
    image: rancher/k3s:v1.37.1-k3s1@sha256:ca7f37d993d82ef0dcdcfecb2e0e2618ea541dbaffc620c8cedebe01a82acd0d
    hostname: k3s
    command: server --disable=traefik --disable=metrics-server --tls-san=k3s
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_KUBECONFIG_OUTPUT: /shared/k3s.yaml
      K3S_KUBECONFIG_MODE: "600"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-node:/etc/rancher/node
      - shared:/shared
    networks: [default, apis]
    mem_limit: 3g
    restart: unless-stopped

  k8s-seed:
    image: alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      KUBECONFIG: /shared/kubeconfig
      FLUX_VERSION: v2.9.6
      TEKTON_VERSION: v1.17.1
      ARGOCD_CHART_VERSION: 10.11.6
    volumes:
      - ./k8s:/seed:ro
      - shared:/shared
      - credentials:/credentials
    depends_on:
      k3s:
        condition: service_started
      gitea-seed:
        condition: service_completed_successfully
    restart: "no"

  komodo-mongo:
    image: mongo:9.0@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    command: --quiet --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_ROOT_USERNAME: komodo
      MONGO_INITDB_ROOT_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
    volumes:
      - komodo-mongo:/data/db
    mem_limit: 768m
    restart: unless-stopped

  komodo:
    image: ghcr.io/moghtech/komodo-core:2.3.4@sha256:91b2afd7b3bb2abea0ebd3046d65ec457eb1f3d505868d1d60cb0f8562490ef9
    init: true
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
      KOMODO_DATABASE_USERNAME: komodo
      KOMODO_DATABASE_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: admin
      KOMODO_INIT_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
      KOMODO_FIRST_SERVER_NAME: demo
      KOMODO_DISABLE_INIT_RESOURCES: "true"
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_TRANSPARENT_MODE: "true"
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
    volumes:
      - komodo-keys:/config/keys
    networks: [default, apis]
    mem_limit: 512m
    depends_on:
      - komodo-mongo
    restart: unless-stopped

  komodo-docker:
    image: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - komodo-docker:/var/lib/docker
    mem_limit: 1g
    restart: unless-stopped

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4@sha256:fb4b52961fcce7a31e3776930e422967b6640f653de876f59f26dea243e29beb
    init: true
    environment:
      DOCKER_HOST: tcp://komodo-docker:2375
      PERIPHERY_CORE_ADDRESS: ws://komodo:9120
      PERIPHERY_CONNECT_AS: demo
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
    volumes:
      - komodo-keys:/config/keys
    mem_limit: 256m
    depends_on:
      - komodo
      - komodo-docker
    restart: unless-stopped

  komodo-seed:
    image: alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      KOMODO_PASSWORD: ${DEMO_ADMIN_PASSWORD:-pipedash-admin}
    volumes:
      - ./komodo:/seed:ro
      - credentials:/credentials
    depends_on:
      - komodo-periphery
    restart: "no"

  pipedash:
    image: ${PIPEDASH_IMAGE:-ghcr.io/hcavarsan/pipedash-web:latest}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PIPEDASH_BIND_ADDR: 0.0.0.0:8080
      PIPEDASH_DATA_DIR: /data
      PIPEDASH_CONFIG_PATH: /config/config.toml
      PIPEDASH_DEMO_MODE: "true"
      PIPEDASH_VAULT_PASSWORD: pipedash-demo
      PIPEDASH_POSTGRES_URL: postgres://pipedash:${DEMO_READER_PASSWORD:-pipedash-reader}@postgres:5432/pipedash
      DEMO_VAULT_PASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
      GITEA_TOKEN_FILE: /credentials/gitea-token
      ARGOCD_TOKEN_FILE: /credentials/argocd-token
      JENKINS_PASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
      KOMODO_API_KEY_FILE: /credentials/komodo-api-key
      KOMODO_API_SECRET_FILE: /credentials/komodo-api-secret
      SSL_CERT_FILE: /status-ca/bundle.crt
      PIPEDASH_PUSH_RELAY_URL: ${PIPEDASH_PUSH_RELAY_URL:-}
    volumes:
      - ./config.toml:/config/config.toml:ro
      - credentials:/credentials:ro
      - status-ca:/status-ca:ro
    tmpfs:
      - /data:uid=65532,gid=65532
      - /tmp:uid=65532,gid=65532
    networks: [apis]
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      jenkins:
        condition: service_healthy
      k8s-seed:
        condition: service_completed_successfully
      komodo-seed:
        condition: service_completed_successfully
      status:
        condition: service_healthy
    restart: unless-stopped

  status:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    entrypoint:
      - sh
      - -c
      - |
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile &
        until [ -s /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done
        cat /etc/ssl/certs/ca-certificates.crt /data/caddy/pki/authorities/local/root.crt > /ca/bundle.tmp
        chmod 644 /ca/bundle.tmp
        mv /ca/bundle.tmp /ca/bundle.crt
        wait
    volumes:
      - ./status:/srv:ro
      - ./status/Caddyfile:/etc/caddy/Caddyfile:ro
      - status-data:/data
      - status-ca:/ca
    networks:
      apis:
        aliases: [status.gitea.demo, status.jenkins.demo, status.argocd.demo]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "test", "-s", "/ca/bundle.crt"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  relay-egress:
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    entrypoint: ["nginx", "-e", "stderr", "-c", "/etc/nginx/egress.conf", "-g", "daemon off;"]
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - ./egress/nginx.conf:/etc/nginx/egress.conf:ro
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
    networks:
      default:
      apis:
        aliases: [relay.pipedash.app]
    mem_limit: 32m
    pids_limit: 32
    restart: unless-stopped

  gateway:
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ANALYTICS_SNIPPET: ${ANALYTICS_SNIPPET:-}
      ANALYTICS_ORIGIN: ${ANALYTICS_ORIGIN:-}
    volumes:
      - ./gateway:/etc/nginx/templates:ro
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /run:uid=101,gid=101
    ports:
      - "127.0.0.1:${PIPEDASH_PORT:-8080}:8080"
    networks: [edge, apis]
    mem_limit: 64m
    pids_limit: 64
    depends_on:
      - pipedash
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: tunnel --no-autoupdate run
    profiles: [public]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [edge]
    mem_limit: 128m
    depends_on:
      - gateway
    restart: unless-stopped

  views-seed:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      PGHOST: postgres
      PGUSER: pipedash
      PGDATABASE: pipedash
      PGPASSWORD: ${DEMO_READER_PASSWORD:-pipedash-reader}
    volumes:
      - ./postgres:/seed:ro
    networks: [apis]
    depends_on:
      - pipedash
    restart: "no"

networks:
  default:
  edge:
  apis:
    internal: true

volumes:
  postgres-data:
  gitea-data:
  runner-data:
  jenkins-home:
  k3s-data:
  k3s-node:
  shared:
  credentials:
  komodo-mongo:
  komodo-keys:
  komodo-docker:
  status-data:
  status-ca:
