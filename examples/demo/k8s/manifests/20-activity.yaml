apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-activity
  namespace: acme-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-activity
  namespace: acme-ci
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [create, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-activity
  namespace: acme-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-activity
subjects:
  - kind: ServiceAccount
    name: demo-activity
    namespace: acme-ci
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-activity
  namespace: acme-ci
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: demo-activity
          restartPolicy: Never
          containers:
            - name: activity
              image: alpine/k8s:1.37.1
              command:
                - sh
                - -c
                - |
                  set -eu
                  for pipeline in build integration-tests deploy; do
                    kubectl create -n acme-ci -f - <<EOF
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    generateName: $pipeline-
                    labels:
                      tekton.dev/pipeline: $pipeline
                  spec:
                    pipelineRef:
                      name: $pipeline
                  EOF
                    runs=$(kubectl get pipelineruns -n acme-ci -l tekton.dev/pipeline=$pipeline \
                      --sort-by=.metadata.creationTimestamp -o name)
                    excess=$(( $(echo "$runs" | wc -l) - 15 ))
                    if [ "$excess" -gt 0 ]; then
                      echo "$runs" | head -n "$excess" | xargs kubectl delete -n acme-ci
                    fi
                  done
