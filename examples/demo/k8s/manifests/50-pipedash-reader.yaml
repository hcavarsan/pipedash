apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipedash-reader
  namespace: pipedash
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: pipedash-reader
  namespace: pipedash
  annotations:
    kubernetes.io/service-account.name: pipedash-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipedash-reader
  namespace: acme-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: pipedash-reader
    namespace: pipedash
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipedash-reader
  namespace: acme-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: pipedash-reader
    namespace: pipedash
