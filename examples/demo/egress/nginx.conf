worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

stream {
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 5s;

    map $ssl_preread_server_name $upstream {
        relay.pipedash.app relay.pipedash.app:443;
        default            127.0.0.1:9;
    }

    log_format egress '$time_iso8601 $remote_addr $ssl_preread_server_name $status';
    access_log /dev/stdout egress;

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $upstream;
        proxy_connect_timeout 10s;
        proxy_timeout 60s;
    }
}
