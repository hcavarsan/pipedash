[storage]
backend = "postgres"
vault_password = "${DEMO_VAULT_PASSWORD}"

[storage.postgres]
connection_string = "${PIPEDASH_POSTGRES_URL}"

[providers.gitea]
name = "Gitea"
type = "gitea"
token = "${GITEA_TOKEN}"

[providers.gitea.config]
base_url = "http://gitea:3000"
selected_items = "acme/web,acme/api,acme/mobile"
status_page_url = "https://status.gitea.demo"

[providers.jenkins]
name = "Jenkins"
type = "jenkins"
token = "${JENKINS_PASSWORD}"

[providers.jenkins.config]
server_url = "http://jenkins:8080"
username = "pipedash"
selected_items = "acme/build,acme/integration-tests,acme/deploy,acme/nightly-e2e,acme/smoke-tests"
status_page_url = "https://status.jenkins.demo"

[providers.argocd]
name = "Argo CD"
type = "argocd"
token = "${ARGOCD_TOKEN}"

[providers.argocd.config]
server_url = "http://k3s:30080"
selected_items = "web,worker,broken"
status_page_url = "https://status.argocd.demo"

[providers.tekton]
name = "Tekton"
type = "tekton"

[providers.tekton.config]
kubeconfig_path = "/credentials/kubeconfig"
namespace_mode = "custom"
namespaces = "acme-ci"

[providers.fluxcd]
name = "Flux"
type = "fluxcd"

[providers.fluxcd.config]
kubeconfig = "/credentials/kubeconfig"
namespaces = "acme-flux"

[providers.komodo]
name = "Komodo"
type = "komodo"
token = "${KOMODO_API_SECRET}"

[providers.komodo.config]
server_url = "http://komodo:9120"
api_key = "${KOMODO_API_KEY}"
selected_items = "storefront,cache,reports"
