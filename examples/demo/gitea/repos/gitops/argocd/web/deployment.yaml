apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      annotations:
        acme.dev/release: "0"
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
