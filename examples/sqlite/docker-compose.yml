services:
  pipedash-data-init:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - pipedash-data:/data

  pipedash:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      platforms:
        - linux/amd64
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      PIPEDASH_BIND_ADDR: 0.0.0.0:8080
      PIPEDASH_DATA_DIR: /data
      PIPEDASH_METRICS_ENABLED: "true"
      PIPEDASH_EMBEDDED_FRONTEND: "true"
      PIPEDASH_CONFIG_PATH: /config/config.toml
      PIPEDASH_VAULT_PASSWORD: vaultpassword@123
      GITHUB_TOKEN: your-github-token-here
    volumes:
      - ./config.toml:/config/config.toml:ro
      - pipedash-data:/data
    depends_on:
      pipedash-data-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pipedash-data:
